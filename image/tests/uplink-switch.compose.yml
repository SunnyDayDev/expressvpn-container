# Стенд для image/tests/uplink-switch.sh — накладывается поверх
# docker-compose.yml в отдельном compose-проекте (свои контейнер, порты, том).
services:
  detour:
    container_name: detour-uplink-test

  # Два SOCKS5-прокси в сети стенда: к ним можно обратиться и по IP, и по
  # имени сервиса через Docker DNS. sing-box — из того же образа Detour.
  socks-a: &socks
    image: ${DETOUR_IMAGE:?set by uplink-switch.sh}
    pull_policy: never
    entrypoint: ["sing-box", "run", "-c", "/etc/socks.json"]
    healthcheck:
      disable: true
    configs:
      - source: socks
        target: /etc/socks.json
  socks-b: *socks

configs:
  socks:
    content: |
      {
        "log": {"level": "warn"},
        "inbounds": [{"type": "socks", "tag": "in", "listen": "0.0.0.0", "listen_port": 1080}],
        "outbounds": [{"type": "direct", "tag": "direct"}]
      }
